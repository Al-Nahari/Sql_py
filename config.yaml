paths:
  raw_csv: data/raw/students.csv
  database: database/students.db
  processed_output: data/processed/final_dataset.csv
  rejected_output: data/rejected/rejected_records.csv
  log_file: logs/pipeline.log

api:
  host: 127.0.0.1
  port: 8899
  path: /students
  timeout: 5
  retries: 3
  retry_backoff_seconds: 0.5

mongodb:
  uri: mongodb://localhost:27017/
  database: Uinveresity
  source_collection: nahari
  server_selection_timeout_ms: 5000
  read_enabled: true

validation:
  age_min: 16
  age_max: 80
  gpa_min: 0
  gpa_max: 4
  attendance_min: 0
  attendance_max: 100
  score_min: 0
  score_max: 100
